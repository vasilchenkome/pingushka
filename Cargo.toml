[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/protocol",
    "crates/storage-postgres",
    "crates/hub-http",
    "crates/hub-bin",
    "crates/agent-bin",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
argon2 = { version = "0.6", features = ["getrandom", "password-hash", "zeroize"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
hmac = "0.13"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
surge-ping = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
toml = { version = "0.9", features = ["parse", "display", "serde"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
