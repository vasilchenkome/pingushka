[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/protocol",
    "crates/storage-postgres",
    "crates/hub-http",
    "crates/hub-bin",
    "crates/agent-bin",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
argon2 = { version = "0.6", features = ["getrandom", "password-hash", "zeroize"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
