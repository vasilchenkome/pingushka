[package]
name = "pingushka-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
pingushka-protocol = { path = "../protocol" }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
surge-ping.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
uuid.workspace = true
