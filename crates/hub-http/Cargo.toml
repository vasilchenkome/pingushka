[package]
name = "pingushka-hub-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
chacha20poly1305.workspace = true
futures-util = "0.3"
hmac.workspace = true
lettre.workspace = true
pingushka-application = { path = "../application" }
pingushka-domain = { path = "../domain" }
pingushka-protocol = { path = "../protocol" }
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower.workspace = true
tower-http = { version = "0.6", features = ["timeout", "fs", "set-header"] }
tracing = "0.1"
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
