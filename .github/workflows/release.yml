name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: pingushka-agent-linux-x86_64
            linker: musl-gcc
          - target: aarch64-unknown-linux-gnu
            asset: pingushka-agent-linux-aarch64
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build agent
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
            export CFLAGS_aarch64_unknown_linux_gnu="--sysroot=/usr/aarch64-linux-gnu"
          fi
          cargo build --release --locked -p pingushka-agent --target "${{ matrix.target }}"
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pingushka-agent" "dist/${{ matrix.asset }}"
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build hub
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --release --locked -p pingushka-hub --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/pingushka-hub dist/pingushka-hub-linux-x86_64
          cp packaging/update-agent.sh dist/update-agent.sh
          cd dist
          sha256sum pingushka-hub-linux-x86_64 > pingushka-hub-linux-x86_64.sha256
          sha256sum update-agent.sh > update-agent.sh.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pingushka-hub-linux-x86_64
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [binaries, hub]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
