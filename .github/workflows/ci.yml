name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://pingushka_ci:pingushka_ci@localhost:5432/pingushka_ci
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pingushka_ci
          POSTGRES_USER: pingushka_ci
          POSTGRES_PASSWORD: pingushka_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pingushka_ci -d pingushka_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@clippy
        with:
          components: rustfmt
      - name: Check release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Cargo.toml version v$version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Test installer and updater scripts
        run: |
          sh -n install.sh
          sh -n packaging/update-agent.sh
          bash packaging/tests/update-agent.sh
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0459

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Hub and PostgreSQL
        env:
          POSTGRES_PASSWORD: ci-smoke
          ALERT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PUBLIC_URL: http://127.0.0.1:8080
          COOKIE_SECURE: "false"
          PINGUSHKA_VERSION: ci
        run: |
          docker compose up -d --build postgres hub
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health
          html=$(curl -fsS http://127.0.0.1:8080/)
          echo "$html" | grep -q '<div id="root">'
          asset=$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://127.0.0.1:8080$asset"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = "404"
          docker build --target agent -t pingushka-agent:ci .
          docker run --rm pingushka-agent:ci --version | grep -Eq '^pingushka-agent [0-9]+\.[0-9]+\.[0-9]+$'
      - name: Stop stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-smoke
          ALERT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose down -v
