services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pingushka}
      POSTGRES_USER: ${POSTGRES_USER:-pingushka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  hub:
    image: ghcr.io/vasilchenkome/pingushka-hub:${PINGUSHKA_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pingushka}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pingushka}
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INSTALL_SCRIPT_URL: ${INSTALL_SCRIPT_URL:-https://raw.githubusercontent.com/vasilchenkome/pingushka/main/install.sh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?Set ALERT_SECRET_KEY in .env or the environment}
      ALERT_EVALUATE_INTERVAL_SECS: ${ALERT_EVALUATE_INTERVAL_SECS:-30}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - hub
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
